name: comdare-prt-art CI (REV 7.6 V11.7)

# Synchron mit .gitlab-ci.yml

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

jobs:
  configure:
    name: cmake configure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ninja-build
      - name: Configure
        run: cmake -B build -G Ninja
      - name: Build prt-art core
        run: cmake --build build --target comdare_prt_art_core

  test:
    name: ctest hybride PrtArtSearchEngine
    runs-on: ubuntu-latest
    needs: configure
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ninja-build
      - name: Configure + build tests
        run: |
          cmake -B build -G Ninja
          cmake --build build
      # REV 7.6 V14.3 — Direkt-Ausfuehrung umgeht gtest_discover_tests MSB3073
      - name: Run prt-art test binary directly (V14.3)
        run: ./build/tests/unit/test_prt_art_identity
