# comdare-prt-art — GitLab CI/CD (REV 10, 2026-06-26): ci-templates-Lint + Standalone-Build+Test (bare-metal)
# ─────────────────────────────────────────────────────────────────────────────
# REV 10 (Debug-Befund 6954): comdare_prt_art_core ist eine INTERFACE-Library (header-only) -> KEIN baubares
#   Ninja-Target -> `--target comdare_prt_art_core` warf "unknown target". Eine INTERFACE-Lib wird nur ueber
#   ihre Consumer kompiliert (die Tests). Daher EIN build+test-Job: configure -> build ALL (kompiliert die
#   Header via Test-Consumer) -> Identity-Test direkt ausfuehren. bare-metal prod-Toolchain (kein apt-Egress, REV 9).
# REV 9: Docker->bare-metal. Lint scannt nur prt-art-eigenen Code (submodule-none).

include:
  - project: 'comdare/cluster/ci-templates'
    ref: development
    file: '/base-pipeline.yml'

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - lint
  - build
  - sanitize

# #277/#21 (User 06.07.): ccache-Bestand auf dev-MinIO via runners.cache.
cache:
  key: "ccache-$CI_PROJECT_NAME"
  paths: [".ccache"]

variables:
  CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
  CCACHE_MAXSIZE: "2G"
  GIT_SUBMODULE_STRATEGY: recursive
  CMAKE_BUILD_PARALLEL_LEVEL: "6"   # User 2026-07-06: 2x6 Kerne bei concurrent=2
  COMDARE_LINT_PATHS: "prt_art tests"     # prt-art-eigene Quelle

# ── Stufe 1: Lint (aus ci-templates) — nur prt-art-eigener Code (submodule-none) ──
lint:secrets:
  extends: .lint-secrets
  tags: [baremetal]
  variables:
    GIT_SUBMODULE_STRATEGY: none
lint:format:
  extends: .lint-format
  tags: [baremetal]
  variables:
    GIT_SUBMODULE_STRATEGY: none
lint:static:
  extends: .lint-static
  tags: [baremetal]
  variables:
    GIT_SUBMODULE_STRATEGY: none

# ── Standalone-Build+Test (bare-metal prod-Toolchain; INTERFACE-Lib via Test-Consumer) ──
build:standalone:
  extends: .bm
  stage: build
  needs: ["lint:secrets"]   # Codex-Review 06-27: hart auf den Secrets-Gate warten
  script:
    - cmake -B build -G Ninja        # Build Tests ON (Default) -> Consumer der INTERFACE-Lib
    # Build-Parallelitaet via CMAKE_BUILD_PARALLEL_LEVEL, NICHT -j nproc
    # 264-c: internal_search-Header sind real; build ALL kompiliert alle Test-Consumer.
    - cmake --build build
    - ctest --test-dir build --output-on-failure
  # KEIN Artefakt (Build+Test-Gate; Beleg im Log)

# ── #273-T3 (2026-07-07): build:clang-Rollout — prt-art baut die volle INTERFACE-Consumer-Fläche unter clang. ──
# OPT-IN + advisory (COMDARE_CLANG_MATRIX=="1"): Hauptpipeline unberührt. clang-22.1.8 auf Runner; lokal EXIT 0 (07.07.).
build:clang:
  extends: .build-clang-latest
  stage: build
  tags: [baremetal]
  variables:
    COMDARE_CMAKE_SOURCE_DIR: "."
    COMDARE_AUDIT_BUILD_TYPE: "Release"
    COMDARE_CMAKE_CONFIGURE_FLAGS: "-G Ninja"
    COMDARE_CMAKE_BUILD_TARGET: "all"

# ── Stufe Sanitize (ASan+UBSan, 10-Stufen-Prinzip P1b) ──
# #278 (2026-07-06): HART geschaltet — 6 Laeufe in Folge success auf main (Jobs 214612..214994).
sanitize:asan-ubsan:
  extends: .bm
  stage: sanitize
  needs: ["lint:secrets"]   # Codex-Review 06-27: hart auf den Secrets-Gate warten
  script:
    - cmake -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
    - cmake --build build-san
    - 'ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 ctest --test-dir build-san --output-on-failure'

.bm:
  tags: [baremetal]
  before_script:
    - 'cmake --version; (g++ --version || c++ --version || echo "KEIN C++-Compiler"); (ninja --version || echo "kein ninja")'
