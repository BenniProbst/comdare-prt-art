# comdare-prt-art — GitLab CI/CD (REV 9, 2026-06-26): ci-templates-Lint + Standalone-Build/Test (bare-metal)
# ─────────────────────────────────────────────────────────────────────────────
# REV 9 (Debug-Befund 6950): Docker debian:bookworm+apt -> BARE-METAL (prod-Toolchain).
#   Der Cluster-Docker-Runner hat KEINEN apt-Egress (deb.debian.org) -> "Unable to locate package"
#   + 380s-Netz-Hang. Die prod-Runner haben die NEUESTE Toolchain (prod-runner-toolchain-setup.sh)
#   -> luftleer/robust, konsistent mit cache-engine/super. Standalone-Eigenschaft bleibt
#   (prt-art-PROD baut OHNE cache-engine-Quelle). GitHub-CI (.github/workflows/ci.yml) bleibt Docker
#   (Internet-Runner) — andere Umgebung. Lint scannt nur prt-art-eigenen Code (submodule-none).

include:
  - project: 'comdare/cluster/ci-templates'
    ref: development
    file: '/base-pipeline.yml'

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - lint
  - configure
  - test

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  COMDARE_LINT_PATHS: "prt_art tests"     # prt-art-eigene Quelle

# ── Stufe 1: Lint (aus ci-templates) — nur prt-art-eigener Code (submodule-none) ──
lint:secrets:
  extends: .lint-secrets
  tags: [baremetal]
  variables:
    GIT_SUBMODULE_STRATEGY: none
lint:format:
  extends: .lint-format
  tags: [baremetal]
  allow_failure: true
  variables:
    GIT_SUBMODULE_STRATEGY: none
lint:static:
  extends: .lint-static
  tags: [baremetal]
  allow_failure: true
  variables:
    GIT_SUBMODULE_STRATEGY: none

# ── Standalone-Build/Test (bare-metal prod-Toolchain; KEIN Docker/apt, KEIN Egress) ──
.bm:
  tags: [baremetal]
  before_script:
    - 'cmake --version; (g++ --version || c++ --version || echo "KEIN C++-Compiler"); (ninja --version || echo "kein ninja")'

configure:default:
  extends: .bm
  stage: configure
  needs: []
  script:
    - cmake -B build-default -G Ninja
    # Build-Parallelitaet via CMAKE_BUILD_PARALLEL_LEVEL (Runner-Core-Budget), NICHT -j nproc
    - cmake --build build-default --target comdare_prt_art_core
  # KEIN Artefakt (Standalone-Build-Gate; Beleg im Log)

test:hybrid_search_engine:
  extends: .bm
  stage: test
  needs: ["configure:default"]
  script:
    - cmake -B build-test -G Ninja
    - cmake --build build-test
    # Direkt-Ausfuehrung (plattform-uniform, umgeht MSB3073 unter MSVC)
    - ./build-test/tests/unit/test_prt_art_identity
  # KEIN Artefakt (Test-Gate; Beleg im Log)
