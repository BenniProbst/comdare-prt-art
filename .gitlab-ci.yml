# comdare-prt-art — GitLab CI/CD (REV 10, 2026-06-26): ci-templates-Lint + Standalone-Build+Test (bare-metal)
# ─────────────────────────────────────────────────────────────────────────────
# REV 10 (Debug-Befund 6954): comdare_prt_art_core ist eine INTERFACE-Library (header-only) -> KEIN baubares
#   Ninja-Target -> `--target comdare_prt_art_core` warf "unknown target". Eine INTERFACE-Lib wird nur ueber
#   ihre Consumer kompiliert (die Tests). Daher EIN build+test-Job: configure -> build ALL (kompiliert die
#   Header via Test-Consumer) -> Identity-Test direkt ausfuehren. bare-metal prod-Toolchain (kein apt-Egress, REV 9).
# REV 9: Docker->bare-metal. Lint scannt nur prt-art-eigenen Code (submodule-none).

include:
  - project: 'comdare/cluster/ci-templates'
    ref: development
    file: '/base-pipeline.yml'

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - lint
  - build
  - sanitize

# #277/#21 (User 06.07.): ccache-Bestand auf dev-MinIO via runners.cache.
cache:
  key: "ccache-$CI_PROJECT_NAME"
  paths: [".ccache"]

variables:
  CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
  CCACHE_MAXSIZE: "2G"
  GIT_SUBMODULE_STRATEGY: recursive
  CMAKE_BUILD_PARALLEL_LEVEL: "6"   # User 2026-07-06: 2x6 Kerne bei concurrent=2
  COMDARE_LINT_PATHS: "prt_art tests"     # prt-art-eigene Quelle
  # B14/O5 (2026-08-21): der EINE ce-Determinismus-Pin -- hochgezogen aus build:registry-roundtrip
  # (#104/K7b-3, Landung 777fff7), weil seither VIER weitere Jobs dieselbe ce-Abhaengigkeit tragen
  # (build:standalone/:debug, build:clang/:debug -- lokale Bau-Probe 2026-08-21: Configure gelingt
  # ohne ce mit Warnung, der BUILD bricht [rc=1]; mit ce 60/60 Targets). Eine Quelle statt fuenf
  # Kopien. UPDATE-WEG unveraendert (s. build:registry-roundtrip-Kommentar): neue VOLLE SHA
  # zusammen mit der XML committen; als Pipeline-Variable uebersteuerbar.
  COMDARE_CE_PIN_SHA: "196a621a8a1180dbd47163b75cbb8b102e66a08b"

# ── Stufe 1: Lint (aus ci-templates) — nur prt-art-eigener Code (submodule-none) ──
# CI-DUAL Lens-Fund 14.08. (Key-Hygiene, ce-04.08.-Muster): die Lint-Jobs kompilieren nicht --
# kein ccache-Zip-Transfer (cache paths leer, wie super toolchain:probe). Damit bleibt
# build:standalone der EINZIGE Writer des globalen gcc-Release-Keys.
lint:secrets:
  extends: .lint-secrets
  tags: [baremetal]
  cache:
    paths: []
  variables:
    GIT_SUBMODULE_STRATEGY: none
lint:format:
  extends: .lint-format
  tags: [baremetal]
  cache:
    paths: []
  variables:
    GIT_SUBMODULE_STRATEGY: none
lint:static:
  extends: .lint-static
  tags: [baremetal]
  cache:
    paths: []
  variables:
    GIT_SUBMODULE_STRATEGY: none

# B14/O5 (2026-08-21): der geteilte ce-Pin-Klon der Bau-Jobs -- EXAKT das #104-Rezept
# (777fff7): job-lokaler Klon auf der gepinnten SHA, Geschwister nur optionaler
# Objekt-Spender (--reference-if-able + --dissociate, nichts im Spender veraendert).
# Konsumiert per !reference in build:standalone/:debug und build:clang/:debug.
.ce-pin-klon:
  script:
    - >
      git clone --no-checkout --reference-if-able ../comdare-cache-engine --dissociate
      "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH%/*}/comdare-cache-engine.git"
      ce-pin
    - git -C ce-pin checkout --detach "$COMDARE_CE_PIN_SHA"
    - 'echo "ce-Pin ausgecheckt: $(git -C ce-pin rev-parse HEAD) (SOLL $COMDARE_CE_PIN_SHA)"'

# ── Standalone-Build+Test (bare-metal prod-Toolchain; INTERFACE-Lib via Test-Consumer) ──
# B14/O5 (2026-08-21): dieser Job (und die drei Geschwister :debug/clang/clang:debug) baute bis
# heute gegen den UNGEPINNTEN Geschwister-Checkout (CMakeLists.txt:23-Default ../comdare-cache-
# engine = Zufallsstand des Runner-Slots) -- dieselbe Fehlerklasse, die #104 fuer
# build:registry-roundtrip geschlossen hat. Jetzt: ce-Pin-Klon + expliziter
# -DCOMDARE_CACHE_ENGINE_DIR. Lokale Bau-Probe im Bau-Bericht (ohne ce: Build rc=1).
build:standalone:
  extends: .bm
  stage: build
  needs: ["lint:secrets"]   # Codex-Review 06-27: hart auf den Secrets-Gate warten
  script:
    - !reference [.ce-pin-klon, script]
    # CI-DUAL 14.08. (KON22-01/8): BuildType EXPLIZIT -- vorher LEER (== keine -O-Flags, -O0-Klasse).
    - >
      cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      -DCOMDARE_CACHE_ENGINE_DIR=$CI_PROJECT_DIR/ce-pin
    # Build-Parallelitaet via CMAKE_BUILD_PARALLEL_LEVEL, NICHT -j nproc
    # 264-c: internal_search-Header sind real; build ALL kompiliert alle Test-Consumer.
    - cmake --build build
    - ctest --test-dir build --output-on-failure
  # KEIN Artefakt (Build+Test-Gate; Beleg im Log)

# -- CI-DUAL 14.08. (Owner verbatim; KON22-01/8, KON55/KON55-01, Paragraf 61, T-11b): Zelle gcc x Debug.
# Kette GCC: build:standalone -> build:standalone:debug (seriell via needs, OOM-Doktrin: nie 2 Vollbauten
# parallel aus einer Kette). ccache: eigener Key je Compiler x BuildType, genau EIN Writer (dieser Job).
build:standalone:debug:
  extends: .bm
  stage: build
  needs: ["build:standalone"]
  cache:
    key: "ccache-$CI_PROJECT_NAME-gcc-dbg"
    paths: [".ccache"]
  script:
    - !reference [.ce-pin-klon, script]
    # B14/O5: derselbe Pin wie build:standalone (eigener job-lokaler Klon; needs-seriell).
    - >
      cmake -B build-dbg -G Ninja -DCMAKE_BUILD_TYPE=Debug
      -DCOMDARE_CACHE_ENGINE_DIR=$CI_PROJECT_DIR/ce-pin
    - cmake --build build-dbg
    - ctest --test-dir build-dbg --output-on-failure

# ── WP-4/F29 (Voll-Audit 2026-07-16): Registry-Round-Trip-Gate (Muster R-E/M-CE-27, analog ce
# contract:profile_coverage/test_axis_registry_roundtrip). Der Generator prt_art_axis_registry_gen war
# EXCLUDE_FROM_ALL ohne jeden ctest/CI-Bezug -> Slot-/Wrapper-Drift an der committeten
# prt_art_axis_registry.xml vorbei waere stumm geblieben. Das Tool braucht das generated/-Verzeichnis
# eines KONFIGURIERTEN cache-engine-Builds (CMake-generierte *_flags.hpp des Patricia-Merge-Organs):
# Schritt (1) konfiguriert die Geschwister-ce NUR (kein Build; dieselbe Sibling-Abhaengigkeit, ueber die
# build:standalone bereits die ce-Header bezieht), Schritt (2) registriert damit den ctest, (3) baut das
# EXCLUDE_FROM_ALL-Tool explizit (2-Pass wie ce), (4) faehrt das Gate. Referenz-Konfiguration:
# prt_art/registry_gen/registry_roundtrip.cmake-Kopf. ──
# K7b-3 (W2, 20.08.): Schritt (1) faehrt seither NICHT mehr gegen den ungepinnten Geschwister-
# Checkout (Zufallsstand des Runner-Slots), sondern gegen einen job-lokalen ce-Klon auf der
# GEPINNTEN vollen SHA (COMDARE_CE_PIN_SHA, s.u.) -- das Gate ist damit deterministisch.
build:registry-roundtrip:
  extends: .bm
  stage: build
  needs: ["lint:secrets"]
  # CI-DUAL Lens-Fund 14.08.: Konsument, pull-only -- build:standalone bleibt der EINE Writer
  # des globalen Keys (Debug-Objekte dieses Jobs treffen den Release-Key ohnehin nicht).
  cache:
    key: "ccache-$CI_PROJECT_NAME"
    paths: [".ccache"]
    policy: pull
  # K7b-3 (W2, 20.08.): Determinismus-Pin. Bis dato fuhr der Job gegen den UNGEPINNTEN
  # Geschwister-Checkout ../comdare-cache-engine -- dessen Stand ist der Zufallsstand des
  # Runner-Slots (welche ce-Pipeline dort zuletzt lief); der Gate-Ausgang war damit nicht
  # reproduzierbar. prt-art traegt KEINEN eigenen ce-Anker (kein .gitmodules, kein
  # Submodul-Gitlink; geprueft 20.08.), darum expliziter SHA-Pin als Variable.
  # B14/O5 (2026-08-21): der Pin-WERT lebt jetzt EINMAL global (variables: COMDARE_CE_PIN_SHA,
  # s. Kopf der Datei samt UPDATE-WEG) -- seit vier weitere Jobs ihn tragen, waere eine
  # job-lokale Kopie die Drift-Quelle. Semantik dieses Jobs unveraendert (gleicher Wert).
  script:
    # K7b-3: job-lokaler ce-Klon AUF DER GEPINNTEN SHA ersetzt den frueheren harten
    # Geschwister-Guard (test -d ../comdare-cache-engine): der Geschwister-Checkout ist nur
    # noch optionaler Objekt-Spender (--reference-if-able; fehlt er, klont der Job voll uebers
    # Netz) und wird via --dissociate entkoppelt -- NICHTS im Spender wird veraendert, keine
    # gc-Kopplung. URL-Rezept nach Bestand (super anhang-forward): CI_JOB_TOKEN +
    # CI_SERVER_HOST + ${CI_PROJECT_PATH%/*} (= comdare/research).
    - >
      git clone --no-checkout --reference-if-able ../comdare-cache-engine --dissociate
      "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH%/*}/comdare-cache-engine.git"
      ce-pin
    - git -C ce-pin checkout --detach "$COMDARE_CE_PIN_SHA"
    # Beleg im Log (literaler Output statt Haekchen): tatsaechlich ausgecheckter ce-Stand.
    - 'echo "ce-Pin ausgecheckt: $(git -C ce-pin rev-parse HEAD) (SOLL $COMDARE_CE_PIN_SHA)"'
    # KEIN submodule-init: ce-CI faehrt selbst GIT_SUBMODULE_STRATEGY none (globale variables
    # der ce .gitlab-ci.yml), ext/ toleriert das leere Q01-Submodul (add_subdirectory(ext)
    # steht hinter if(EXISTS ext/CMakeLists.txt), einer ce-getrackten Datei) -- exakte
    # Gleichheit mit dem ce-eigenen, gruen belegten CI-Weg.
    # CI-DUAL Tranche 2 (F2-Default Debug): BuildType EXPLIZIT -- vorher LEER (== keine -O-Flags, -O0-Klasse;
    # Debug ist die verhaltensnahe Deklaration, Release waere eine Verhaltensaenderung).
    - cmake -B build-ce-conf -S ce-pin -G Ninja -DCMAKE_BUILD_TYPE=Debug
    # K7b-3 Lueckenschluss (Job 382653): OHNE expliziten CACHE_ENGINE_DIR fiel der Configure auf den
    # CMake-Default ../comdare-cache-engine zurueck (CMakeLists.txt:23) -- die INCLUDE-Haelfte lief damit
    # weiter gegen den ungepinnten Geschwister-Zufallsstand, nur generated/ war gepinnt. Beide Haelften
    # zeigen jetzt auf ce-pin; erst damit ist der Job vollstaendig deterministisch.
    - >
      cmake -B build-reggen -G Ninja -DCMAKE_BUILD_TYPE=Debug
      -DCOMDARE_CACHE_ENGINE_DIR=$CI_PROJECT_DIR/ce-pin
      -DCOMDARE_CE_GENERATED_DIR=$CI_PROJECT_DIR/build-ce-conf/generated
    - cmake --build build-reggen --target prt_art_axis_registry_gen
    - ctest --test-dir build-reggen -R '^test_prt_registry_roundtrip$' --output-on-failure -V

# ── #273-T3 (2026-07-07): build:clang-Rollout — prt-art baut die volle INTERFACE-Consumer-Fläche unter clang. ──
# CI-DUAL 14.08. TOTES GATE GEHEILT: das fruehere extends .build-clang-latest erbte die Template-Rule
# 'COMDARE_CLANG_MATRIX == "1"' -- die Variable war in prt-art NIRGENDS gesetzt (einziger Treffer war dieser
# Kommentarblock) => der Job lief in KEINER Pipeline (exakt die Fehlerklasse ce :150-163 "Ein Gate, das nie
# aufgeht, ist kein Gate"). Heilung: eigener Job-Body (das Template baut nur, testet nie) + ctest-Gate.
# Zelle clang x Release (KON22-01/8: beide Compiler Pflicht, skip VERBOTEN; kein allow_failure).
build:clang:
  extends: .bm
  stage: build
  needs: ["lint:secrets"]
  cache:
    key: "ccache-$CI_PROJECT_NAME-clang"
    paths: [".ccache"]
  script:
    - !reference [.ce-pin-klon, script]
    # B14/O5: derselbe ce-Pin wie build:standalone (gleiche Fehlerklasse, gleicher Zug).
    - |
      set -euo pipefail
      _CXX=""; _CC=""
      for v in 22 21 20 19 18 17 16; do
        if command -v "clang++-$v" >/dev/null 2>&1; then _CXX="clang++-$v"; _CC="clang-$v"; break; fi
      done
      [ -n "$_CXX" ] || { echo "FEHLER: kein clang auf Runner (Infra-HO)"; exit 5; }
      echo "GNU-Bauweg (clang): CC=$_CC CXX=$_CXX ($($_CXX --version | head -n1))"
      cmake -B build-clang -G Ninja -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_C_COMPILER="$_CC" -DCMAKE_CXX_COMPILER="$_CXX" \
        -DCOMDARE_CACHE_ENGINE_DIR="$CI_PROJECT_DIR/ce-pin"
      cmake --build build-clang
      ctest --test-dir build-clang --output-on-failure

# -- CI-DUAL 14.08.: Zelle clang x Debug. Kette CLANG: build:clang -> build:clang:debug (seriell via needs).
build:clang:debug:
  extends: .bm
  stage: build
  needs: ["build:clang"]
  cache:
    key: "ccache-$CI_PROJECT_NAME-clang-dbg"
    paths: [".ccache"]
  script:
    - !reference [.ce-pin-klon, script]
    # B14/O5: derselbe ce-Pin (vierter und letzter Job der Klasse).
    - |
      set -euo pipefail
      _CXX=""; _CC=""
      for v in 22 21 20 19 18 17 16; do
        if command -v "clang++-$v" >/dev/null 2>&1; then _CXX="clang++-$v"; _CC="clang-$v"; break; fi
      done
      [ -n "$_CXX" ] || { echo "FEHLER: kein clang auf Runner (Infra-HO)"; exit 5; }
      echo "GNU-Bauweg (clang, Debug): CC=$_CC CXX=$_CXX ($($_CXX --version | head -n1))"
      cmake -B build-clang-dbg -G Ninja -DCMAKE_BUILD_TYPE=Debug \
        -DCMAKE_C_COMPILER="$_CC" -DCMAKE_CXX_COMPILER="$_CXX" \
        -DCOMDARE_CACHE_ENGINE_DIR="$CI_PROJECT_DIR/ce-pin"
      cmake --build build-clang-dbg
      ctest --test-dir build-clang-dbg --output-on-failure

# ── Stufe Sanitize (ASan+UBSan, 10-Stufen-Prinzip P1b) ──
# #278 (2026-07-06): HART geschaltet — 6 Laeufe in Folge success auf main (Jobs 214612..214994).
sanitize:asan-ubsan:
  extends: .bm
  stage: sanitize
  needs: ["lint:secrets"]   # Codex-Review 06-27: hart auf den Secrets-Gate warten
  # CI-DUAL Lens-Fund 14.08.: eigene Objektklasse (Sanitizer-Flags) = eigener Key, DIESER Job
  # ist ihr Writer (exakt die ce-Regression 04.08.: EIN Misch-Key kostete restore 4s->150s).
  cache:
    key: "ccache-$CI_PROJECT_NAME-asan"
    paths: [".ccache"]
  script:
    - cmake -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
    - cmake --build build-san
    - 'ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 ctest --test-dir build-san --output-on-failure'

.bm:
  tags: [baremetal]
  before_script:
    - 'cmake --version; (g++ --version || c++ --version || echo "KEIN C++-Compiler"); (ninja --version || echo "kein ninja")'
