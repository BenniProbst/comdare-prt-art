# comdare-prt-art — GitLab CI/CD (REV 10, 2026-06-26): ci-templates-Lint + Standalone-Build+Test (bare-metal)
# ─────────────────────────────────────────────────────────────────────────────
# REV 10 (Debug-Befund 6954): comdare_prt_art_core ist eine INTERFACE-Library (header-only) -> KEIN baubares
#   Ninja-Target -> `--target comdare_prt_art_core` warf "unknown target". Eine INTERFACE-Lib wird nur ueber
#   ihre Consumer kompiliert (die Tests). Daher EIN build+test-Job: configure -> build ALL (kompiliert die
#   Header via Test-Consumer) -> Identity-Test direkt ausfuehren. bare-metal prod-Toolchain (kein apt-Egress, REV 9).
# REV 9: Docker->bare-metal. Lint scannt nur prt-art-eigenen Code (submodule-none).

include:
  - project: 'comdare/cluster/ci-templates'
    ref: development
    file: '/base-pipeline.yml'

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - lint
  - build
  - sanitize

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  COMDARE_LINT_PATHS: "prt_art tests"     # prt-art-eigene Quelle

# ── Stufe 1: Lint (aus ci-templates) — nur prt-art-eigener Code (submodule-none) ──
lint:secrets:
  extends: .lint-secrets
  tags: [baremetal]
  variables:
    GIT_SUBMODULE_STRATEGY: none
lint:format:
  extends: .lint-format
  tags: [baremetal]
  allow_failure: true
  variables:
    GIT_SUBMODULE_STRATEGY: none
  rules:                          # B (User 2026-06-26): bis #179-Format-Pass MANUELL (harte Gates bleiben)
    - when: manual
lint:static:
  extends: .lint-static
  tags: [baremetal]
  allow_failure: true
  variables:
    GIT_SUBMODULE_STRATEGY: none
  rules:
    - when: manual

# ── Standalone-Build+Test (bare-metal prod-Toolchain; INTERFACE-Lib via Test-Consumer) ──
build:standalone:
  extends: .bm
  stage: build
  needs: ["lint:secrets"]   # Codex-Review 06-27: hart auf den Secrets-Gate warten
  script:
    - cmake -B build -G Ninja        # Build Tests ON (Default) -> Consumer der INTERFACE-Lib
    # Build-Parallelitaet via CMAKE_BUILD_PARALLEL_LEVEL, NICHT -j nproc
    # Nur den Ziel-Test bauen (kompiliert die comdare_prt_art_core-Header als Consumer).
    # KEIN build-ALL: test_internal_search.cpp referenziert einen fehlenden Header
    # (prt_art/internal_search/array_256.hpp) = eigenstaendiger prt-art-Defekt -> #179-Cleanup.
    - cmake --build build --target test_prt_art_identity
    # Direkt-Ausfuehrung (plattform-uniform, umgeht MSB3073 unter MSVC)
    - ./build/tests/unit/test_prt_art_identity
  # KEIN Artefakt (Build+Test-Gate; Beleg im Log)

# ── Stufe Sanitize (ASan+UBSan, 10-Stufen-Prinzip P1b; advisory bis #179, dann HART) ──
sanitize:asan-ubsan:
  extends: .bm
  stage: sanitize
  needs: ["lint:secrets"]   # Codex-Review 06-27: hart auf den Secrets-Gate warten
  allow_failure: true
  script:
    - cmake -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
    - cmake --build build-san --target test_prt_art_identity
    - 'ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 ./build-san/tests/unit/test_prt_art_identity'

.bm:
  tags: [baremetal]
  before_script:
    - 'cmake --version; (g++ --version || c++ --version || echo "KEIN C++-Compiler"); (ninja --version || echo "kein ninja")'
