# comdare-prt-art — GitLab CI Pipeline (REV 7.6 V11.7)
# Synchron mit .github/workflows/ci.yml

stages:
  - configure
  - test

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

.linux_base:
  image: debian:bookworm
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
        build-essential cmake ninja-build git ca-certificates

configure:default:
  extends: .linux_base
  stage: configure
  script:
    - cmake -B build-default -G Ninja
    - cmake --build build-default --target comdare_prt_art_core
  artifacts:
    paths:
      - build-default/CMakeCache.txt
    expire_in: 1 day
    when: always

test:hybrid_search_engine:
  extends: .linux_base
  stage: test
  needs: ["configure:default"]
  script:
    - cmake -B build-test -G Ninja
    - cmake --build build-test
    # REV 7.6 V14.3 — Direkt-Ausfuehrung umgeht MSB3073 (MSVC); plattform-uniform
    - ./build-test/tests/unit/test_prt_art_identity
  artifacts:
    paths:
      - build-test/Testing/
    expire_in: 1 week
    when: always
